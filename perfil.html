<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil | Ponto Zero</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font:16px Arial,sans-serif}header{padding:22px 8%;background:#111116;border-bottom:1px solid #292930;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}header h1{margin:0}header span{color:#e63946}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:#ddd;text-decoration:none}.wrap{max-width:900px;margin:auto;padding:40px 7%}.panel{background:#17171e;border:1px solid #30303a;border-radius:12px;padding:24px;margin-bottom:20px}.muted{color:#aaa;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button,.btn{border:0;border-radius:7px;padding:12px 17px;background:#e63946;color:#fff;font-weight:bold;cursor:pointer;text-decoration:none}.secondary{background:#34343f}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;background:#22222c;border-radius:8px;padding:13px}.score{color:#f5c542;font-weight:bold}.status{color:#f5c542;min-height:20px}h2{margin-top:0;color:#fff}h1#nome{font-size:32px;margin:0 0 10px}@media(max-width:600px){.actions button,.actions a{width:100%;text-align:center}}</style><link rel="stylesheet" href="espaco.css?v=1">
</head><body>
<header><h1>PONTO <span>ZERO.</span></h1><nav><a href="index.html">Início</a><a href="filmes.html">Filmes</a><a href="comunidade.html">Comunidade</a><a href="social.html">Amigos</a><a href="ajuda.html">Ajuda</a></nav></header>
<main class="wrap"><section class="panel"><h1 id="nome">Carregando perfil...</h1><p id="sobre" class="muted"></p><div class="actions" id="acoes"></div><p id="status" class="status" role="status"></p></section>
<section class="panel"><h2>🎬 Notas de filmes</h2><p class="muted">Avaliações públicas feitas por este cinéfilo.</p><div id="notas" class="list">Carregando avaliações...</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="pz-core.js?v=3"></script><script src="catalogo-1000.js"></script><script src="catalogo-extra.js"></script><script>
(async()=>{const $=id=>document.getElementById(id),db=window.PZ?.getSupabase(),target=new URLSearchParams(location.search).get('id');if(!db||!target){$('nome').textContent='Perfil não encontrado';$('sobre').textContent='Volte à comunidade e escolha um perfil válido.';return}
const {data:{session}}=await db.auth.getSession();const me=session?.user||null;
const {data:profile,error}=await db.from('perfis').select('user_id,apelido,generos').eq('user_id',target).maybeSingle();if(error||!profile){$('nome').textContent='Perfil não encontrado';$('sobre').textContent='Este perfil não está disponível.';return}
$('nome').textContent=profile.apelido||'Cinéfilo';$('sobre').textContent='Membro da comunidade Ponto Zero'+(profile.generos?.length?' • Gêneros favoritos: '+profile.generos.join(', '):'');
const actions=$('acoes'),status=$('status');const addLink=(label,url,cls='')=>{const a=document.createElement('a');a.className='btn '+cls;a.href=url;a.textContent=label;actions.append(a)};
if(me&&me.id!==target){const {data:rows}=await db.from('solicitacoes_amizade').select('id,remetente_id,destinatario_id,status').or('and(remetente_id.eq.'+me.id+',destinatario_id.eq.'+target+'),and(remetente_id.eq.'+target+',destinatario_id.eq.'+me.id+')').limit(1);const rel=rows?.[0];
if(rel?.status==='aceita')addLink('💬 Conversar','chat.html?user='+encodeURIComponent(target));
else if(rel?.status==='pendente'){status.textContent=rel.remetente_id===me.id?'Convite enviado. Aguardando resposta.':'Esta pessoa enviou um convite para você. Acesse Amigos para responder.';if(rel.destinatario_id===me.id)addLink('Ver convites','social.html')}
else{const b=document.createElement('button');b.textContent='＋ Adicionar amigo';b.onclick=async()=>{b.disabled=true;if(rel?.status==='recusada'){const {error:delError}=await db.from('solicitacoes_amizade').delete().eq('id',rel.id);if(delError){status.textContent='Não foi possível renovar o convite.';b.disabled=false;return}}const {error}=await db.from('solicitacoes_amizade').insert({remetente_id:me.id,destinatario_id:target});if(error){status.textContent='Não foi possível enviar o convite.';b.disabled=false;return}status.textContent='Convite enviado!';b.textContent='Convite enviado'};actions.append(b)}
}else if(me&&me.id===target){status.textContent='Este é o seu perfil público.';addLink('Editar meu perfil','comunidade.html#perfil','secondary');addLink('Encontrar amigos','social.html')}
else{status.textContent='Entre na sua conta para adicionar amigos e conversar.';addLink('Entrar / criar conta','comunidade.html#conta')}
const {data:ratings,error:ratingError}=await db.from('avaliacoes_usuarios').select('filme_slug,nota,atualizado_em').eq('user_id',target).order('atualizado_em',{ascending:false}).limit(100);const list=$('notas');list.replaceChildren();if(ratingError){list.textContent='Não foi possível carregar as notas.';return}if(!ratings?.length){list.textContent='Este perfil ainda não avaliou filmes.';return}
const titles=new Map();(window.catalogo1000||[]).forEach(f=>titles.set(f.slug,f.titulo));(window.filmesExtras||[]).forEach(f=>titles.set(f[0],f[1]));
ratings.forEach(r=>{const d=document.createElement('div');d.className='item';const a=document.createElement('a');a.href='detalhes.html?filme='+encodeURIComponent(r.filme_slug);a.textContent=titles.get(r.filme_slug)||r.filme_slug;const n=document.createElement('strong');n.className='score';n.textContent=Number(r.nota).toFixed(1).replace('.',',')+'/10';d.append(a,n);list.append(d)});
})();
</script><a class="pz-help-float" href="ajuda.html" aria-label="Abrir central de ajuda">✦ <span>Precisa de ajuda?</span></a>
</body></html>
