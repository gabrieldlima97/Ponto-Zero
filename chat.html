<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat | Ponto Zero</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font:16px Arial,sans-serif}header{padding:20px 8%;background:#111116;border-bottom:1px solid #292930;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}header h1{margin:0}header span{color:#e63946}nav{display:flex;gap:18px;flex-wrap:wrap}nav a{color:#ddd;text-decoration:none}.wrap{max-width:850px;margin:auto;padding:28px 5%}.panel{background:#17171e;border:1px solid #30303a;border-radius:12px;padding:20px}.muted{color:#aaa}.messages{height:min(58vh,560px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px 2px}.message{max-width:82%;background:#292933;border-radius:12px;padding:11px 14px;overflow-wrap:anywhere;align-self:flex-start}.message.mine{align-self:flex-end;background:#6f202a}.message time{display:block;color:#ddd9;font-size:11px;margin-top:6px}.send{display:flex;gap:9px}.send textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:130px;background:#20202a;border:1px solid #444;border-radius:8px;color:#fff;padding:12px;font:inherit}.send button{background:#e63946;color:white;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer}.status{color:#f5c542;min-height:20px}@media(max-width:520px){.send{flex-direction:column}.send button{width:100%}}</style></head><body>
<header><h1>PONTO <span>ZERO.</span></h1><nav><a href="index.html">Início</a><a href="comunidade.html">Comunidade</a><a href="social.html">Amigos</a></nav></header>
<main class="wrap"><section class="panel"><h2 id="titulo">Conversa</h2><p class="muted">Mensagens privadas entre amigos.</p><div id="mensagens" class="messages">Carregando conversa...</div><form id="form" class="send"><textarea id="texto" maxlength="2000" placeholder="Escreva uma mensagem..." required></textarea><button id="enviar">Enviar</button></form><p id="status" class="status" role="status"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="pz-core.js?v=3"></script><script>
(async()=>{const $=id=>document.getElementById(id),db=window.PZ?.getSupabase(),target=new URLSearchParams(location.search).get('user');const box=$('mensagens'),status=$('status');if(!db||!target){box.textContent='Conversa indisponível.';return}
const {data:{session}}=await db.auth.getSession();const me=session?.user;if(!me){box.textContent='Entre na sua conta para usar o chat.';return}if(me.id===target){box.textContent='Você não pode conversar consigo mesmo.';return}
const {data:profile,error:profileError}=await db.from('perfis').select('apelido').eq('user_id',target).maybeSingle();if(profileError||!profile){box.textContent='Perfil não encontrado.';return}$('titulo').textContent='💬 '+(profile.apelido||'Cinéfilo');
const {data:relation,error:relationError}=await db.from('solicitacoes_amizade').select('id,status,remetente_id,destinatario_id').or('and(remetente_id.eq.'+me.id+',destinatario_id.eq.'+target+'),and(remetente_id.eq.'+target+',destinatario_id.eq.'+me.id+')').limit(1);if(relationError||relation?.[0]?.status!=='aceita'){box.textContent='O chat só fica disponível entre amigos. Envie ou aceite um convite primeiro.';return}
function draw(rows){box.replaceChildren();if(!rows?.length){box.textContent='Ainda não há mensagens. Diga oi!';return}rows.forEach(m=>{const d=document.createElement('div');d.className='message'+(m.remetente_id===me.id?' mine':'');const p=document.createElement('div');p.textContent=m.texto;const t=document.createElement('time');const date=new Date(m.criado_em);t.textContent=Number.isNaN(date.getTime())?'':date.toLocaleString('pt-BR');d.append(p,t);box.append(d)});box.scrollTop=box.scrollHeight}
async function load(){const {data,error}=await db.from('mensagens').select('id,remetente_id,destinatario_id,texto,criado_em').or('and(remetente_id.eq.'+me.id+',destinatario_id.eq.'+target+'),and(remetente_id.eq.'+target+',destinatario_id.eq.'+me.id+')').order('criado_em',{ascending:true}).limit(300);if(error){status.textContent='Não foi possível carregar as mensagens.';console.error(error);return}draw(data)}
$('form').onsubmit=async e=>{e.preventDefault();const texto=$('texto').value.trim();if(!texto)return;const b=$('enviar');b.disabled=true;try{const {error}=await db.from('mensagens').insert({remetente_id:me.id,destinatario_id:target,texto});if(error)throw error;$('texto').value='';await load();status.textContent='Mensagem enviada.';setTimeout(()=>{status.textContent=''},2000)}catch(error){status.textContent='Não foi possível enviar. Confira se vocês ainda são amigos.';console.error(error)}finally{b.disabled=false}};
await load();const channel=db.channel('chat-'+[me.id,target].sort().join('-')).on('postgres_changes',{event:'INSERT',schema:'public',table:'mensagens'},payload=>{const m=payload.new;if((m.remetente_id===me.id&&m.destinatario_id===target)||(m.remetente_id===target&&m.destinatario_id===me.id))load()}).subscribe();
window.addEventListener('beforeunload',()=>db.removeChannel(channel));
})();
</script></body></html>
