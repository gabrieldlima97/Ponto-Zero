<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amigos | Ponto Zero</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0f;color:#fff;font:16px Arial,sans-serif}header{padding:22px 8%;background:#111116;border-bottom:1px solid #292930;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}header h1{margin:0}header span{color:#e63946}nav{display:flex;gap:18px;flex-wrap:wrap}a{color:#ff7b84;text-decoration:none}nav a{color:#ddd}.wrap{max-width:1000px;margin:auto;padding:35px 7%}.panel{background:#17171e;border:1px solid #30303a;border-radius:12px;padding:22px;margin:0 0 20px}.panel h2{margin:0 0 12px}.muted,.hint{color:#aaa;line-height:1.5}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:180px;padding:12px;background:#20202a;border:1px solid #444;border-radius:7px;color:#fff}button{padding:11px 15px;border:0;border-radius:7px;background:#e63946;color:white;font-weight:bold;cursor:pointer}button.secondary{background:#34343f}button:disabled{opacity:.55;cursor:wait}.list{display:grid;gap:10px;margin-top:14px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#22222c;border-radius:8px;padding:13px}.item small{display:block;color:#aaa;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{color:#f5c542;min-height:20px}.empty{color:#999;padding:10px 0}@media(max-width:600px){.item{align-items:flex-start}.actions{width:100%}.actions button{flex:1}}
</style></head><body>
<header><h1>PONTO <span>ZERO.</span></h1><nav><a href="index.html">Início</a><a href="filmes.html">Filmes</a><a href="comunidade.html">Comunidade</a><a href="social.html">Amigos</a></nav></header>
<main class="wrap">
<section class="panel"><h2>👥 Encontre cinéfilos</h2><p class="muted">Pesquise pelo apelido de alguém e envie um convite de amizade.</p><div class="row"><input id="busca" class="field" maxlength="30" placeholder="Digite um apelido"><button id="buscar">Buscar pessoas</button></div><div id="resultados" class="list"></div><p id="buscaMsg" class="status" role="status"></p></section>
<section class="panel"><h2>📨 Convites recebidos</h2><div id="recebidos" class="list">Carregando...</div></section>
<section class="panel"><h2>📤 Convites enviados</h2><div id="enviados" class="list">Carregando...</div></section>
<section class="panel"><h2>💬 Meus amigos</h2><div id="amigos" class="list">Carregando...</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="pz-core.js?v=3"></script><script>
(async()=>{
const db=window.PZ?.getSupabase(),$=id=>document.getElementById(id);
if(!db){$('recebidos').textContent='Serviço indisponível.';return}
let user=null;
const {data:{session},error}=await db.auth.getSession();if(error||!session){$('recebidos').textContent='Entre na sua conta pela página Comunidade para usar amizades e chat.';$('enviados').textContent='';$('amigos').textContent='';return}user=session.user;
const nome=async id=>{const {data}=await db.from('perfis').select('user_id,apelido').eq('user_id',id).maybeSingle();return data?.apelido||'Cinéfilo'};
const item=(title,sub,actions=[])=>{const d=document.createElement('div');d.className='item';const left=document.createElement('div');const b=document.createElement('strong');b.textContent=title;const s=document.createElement('small');s.textContent=sub||'';left.append(b,s);const right=document.createElement('div');right.className='actions';actions.forEach(a=>right.append(a));d.append(left,right);return d};
const btn=(label,fn,secondary=false)=>{const b=document.createElement('button');b.textContent=label;if(secondary)b.className='secondary';b.onclick=fn;return b};
const link=(label,url)=>{const a=document.createElement('a');a.textContent=label;a.href=url;return a};
async function carregar(){
 const {data:rows,error}=await db.from('solicitacoes_amizade').select('id,remetente_id,destinatario_id,status,criado_em').or('remetente_id.eq.'+user.id+',destinatario_id.eq.'+user.id).order('criado_em',{ascending:false});
 if(error){$('recebidos').textContent='Não foi possível carregar convites.';console.error(error);return}
 const incoming=rows.filter(x=>x.destinatario_id===user.id&&x.status==='pendente');
 const outgoing=rows.filter(x=>x.remetente_id===user.id&&x.status==='pendente');
 const accepted=rows.filter(x=>x.status==='aceita');
 $('recebidos').replaceChildren();$('enviados').replaceChildren();$('amigos').replaceChildren();
 if(!incoming.length)$('recebidos').textContent='Nenhum convite recebido.';
 for(const r of incoming){const n=await nome(r.remetente_id);$('recebidos').append(item(n,'Quer ser seu amigo.',[btn('Aceitar',async()=>{const {error}=await db.from('solicitacoes_amizade').update({status:'aceita'}).eq('id',r.id);if(error)alert('Não foi possível aceitar o convite.');await carregar()}),btn('Recusar',async()=>{const {error}=await db.from('solicitacoes_amizade').update({status:'recusada'}).eq('id',r.id);if(error)alert('Não foi possível recusar.');await carregar()},true)]))}
 if(!outgoing.length)$('enviados').textContent='Nenhum convite pendente.';
 for(const r of outgoing){const n=await nome(r.destinatario_id);$('enviados').append(item(n,'Convite aguardando resposta.',[link('Ver perfil','perfil.html?id='+encodeURIComponent(r.destinatario_id))]))}
 if(!accepted.length)$('amigos').textContent='Você ainda não tem amigos adicionados.';
 for(const r of accepted){const id=r.remetente_id===user.id?r.destinatario_id:r.remetente_id,n=await nome(id);$('amigos').append(item(n,'Amizade aceita.',[link('Perfil','perfil.html?id='+encodeURIComponent(id)),link('Abrir chat','chat.html?user='+encodeURIComponent(id))]))}
}
async function buscar(){const q=$('busca').value.trim();$('resultados').replaceChildren();$('buscaMsg').textContent='';if(q.length<2){$('buscaMsg').textContent='Digite pelo menos 2 letras.';return}
const {data,error}=await db.from('perfis').select('user_id,apelido').ilike('apelido','%'+q.replace(/[%_]/g,'')+'%').neq('user_id',user.id).limit(20);
if(error){$('buscaMsg').textContent='Não foi possível pesquisar agora.';console.error(error);return}
if(!data?.length){$('resultados').textContent='Ninguém encontrado com esse apelido.';return}
for(const p of data){const {data:existing}=await db.from('solicitacoes_amizade').select('id,status,remetente_id,destinatario_id').or('and(remetente_id.eq.'+user.id+',destinatario_id.eq.'+p.user_id+'),and(remetente_id.eq.'+p.user_id+',destinatario_id.eq.'+user.id+')').limit(1).maybeSingle();
let action;if(existing?.status==='aceita')action=link('Ver perfil','perfil.html?id='+p.user_id);else if(existing?.status==='pendente')action=document.createTextNode(existing.remetente_id===user.id?'Convite enviado':'Convite recebido');else action=btn('Adicionar amigo',async()=>{if(existing?.status==='recusada'){const {error:delError}=await db.from('solicitacoes_amizade').delete().eq('id',existing.id);if(delError){$('buscaMsg').textContent='Não foi possível renovar o convite.';return}}const {error}=await db.from('solicitacoes_amizade').insert({remetente_id:user.id,destinatario_id:p.user_id});if(error){$('buscaMsg').textContent=error.code==='23505'?'Já existe um convite entre vocês.':'Não foi possível enviar o convite.';return}$('buscaMsg').textContent='Convite enviado para '+p.apelido+'!';buscar();carregar()});
$('resultados').append(item(p.apelido||'Cinéfilo','Perfil público', [action,link('Abrir perfil','perfil.html?id='+encodeURIComponent(p.user_id))]));}
}
$('buscar').onclick=buscar;$('busca').addEventListener('keydown',e=>{if(e.key==='Enter')buscar()});await carregar();
})();
</script></body></html>
